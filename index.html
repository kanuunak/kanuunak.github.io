<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flappy Cat 🐱</title>
<meta name="description" content="플래피 버드… 가 아니라 플래피 캣! 탭해서 고양이를 날려보세요.">
<meta name="theme-color" content="#1b1535">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1535;
    --ink: #fff7ea;
    --accent: #ffb347;
    --accent-2: #ff7eb6;
    --panel: rgba(27, 21, 53, 0.82);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(ellipse at top, #2d2358 0%, var(--bg) 60%, #0e0b1d 100%);
    color: var(--ink);
    font-family: 'Jua', system-ui, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  .stage {
    position: relative;
    aspect-ratio: 9 / 16;
    height: min(100%, 900px);
    max-width: 100%;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 3px rgba(255,255,255,.06);
  }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; text-align: center;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .overlay.hidden { opacity: 0; }
  .title {
    font-size: clamp(40px, 9vh, 68px);
    line-height: .95;
    color: var(--accent);
    text-shadow: 0 4px 0 #b3531c, 0 10px 24px rgba(0,0,0,.45);
    letter-spacing: 1px;
    animation: bob 1.6s ease-in-out infinite;
  }
  .title span { display: block; color: var(--ink); text-shadow: 0 4px 0 #6b4aa8, 0 10px 24px rgba(0,0,0,.45); }
  .hint {
    font-size: clamp(16px, 2.6vh, 22px);
    background: var(--panel);
    padding: 10px 20px;
    border-radius: 999px;
    border: 2px solid rgba(255,255,255,.12);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .card {
    background: var(--panel);
    border: 2px solid rgba(255,255,255,.12);
    border-radius: 20px;
    padding: 20px 34px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .card h2 { font-size: clamp(30px, 6vh, 46px); color: var(--accent-2); font-weight: normal; margin-bottom: 8px; }
  .row { display: flex; gap: 28px; justify-content: center; }
  .stat small { display: block; font-size: 14px; opacity: .7; }
  .stat b { font-size: 38px; font-weight: normal; color: var(--accent); }
  .medal { margin-top: 6px; font-size: 18px; min-height: 1em; }
  .btn {
    pointer-events: auto;
    font: inherit; font-size: 20px;
    color: #3a1d00;
    background: linear-gradient(#ffd27a, var(--accent));
    border: 0; border-radius: 14px;
    padding: 12px 28px;
    box-shadow: 0 5px 0 #b3531c;
    cursor: pointer;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b3531c; }
  .best-chip {
    position: absolute; top: 14px; right: 14px;
    font-size: 15px; background: var(--panel);
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.12);
    pointer-events: none;
  }
  .mute {
    position: absolute; top: 12px; left: 12px;
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.15);
    background: var(--panel); color: var(--ink);
    font-size: 18px; cursor: pointer;
  }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  @keyframes pulse { 50% { transform: scale(1.05); } }
  @media (prefers-reduced-motion: reduce) {
    .title, .hint { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="game" aria-label="Flappy Cat 게임 화면"></canvas>

    <div class="overlay" id="startScreen" style="justify-content:flex-start;padding-top:16%">
      <div class="title">FLAPPY<span>CAT</span></div>
      <div class="hint">탭 · 클릭 · 스페이스로 점프! 🐾</div>
      <div style="font-size:15px;opacity:.75">🐟 생선을 먹으면 보너스 +2</div>
    </div>

    <div class="overlay hidden" id="overScreen">
      <div class="card">
        <h2>냐아앙… 😿</h2>
        <div class="row">
          <div class="stat"><small>점수</small><b id="finalScore">0</b></div>
          <div class="stat"><small>최고</small><b id="bestScore">0</b></div>
        </div>
        <div class="medal" id="medal"></div>
      </div>
      <button class="btn" id="retry">다시 하기</button>
    </div>

    <div class="best-chip" id="bestChip">🏆 0</div>
    <button class="mute" id="mute" aria-label="소리 켜기/끄기">🔊</button>
  </div>
</div>

<script>
(() => {
  // ---------- setup ----------
  const W = 450, H = 800;             // logical resolution
  const GROUND_H = 90;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const bestScoreEl = document.getElementById('bestScore');
  const medalEl = document.getElementById('medal');
  const bestChip = document.getElementById('bestChip');
  const muteBtn = document.getElementById('mute');

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  window.addEventListener('resize', resize);

  // ---------- storage (safe) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  let best = store.get('flappycat.best', 0);
  let muted = store.get('flappycat.muted', false);
  bestChip.textContent = '🏆 ' + best;
  muteBtn.textContent = muted ? '🔇' : '🔊';

  // ---------- audio ----------
  let actx = null;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone({ f0, f1, dur = .15, type = 'sine', vol = .15, delay = 0 }) {
    if (muted) return;
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + .02);
  }
  const sfx = {
    flap()  { tone({ f0: 520, f1: 780, dur: .09, type: 'triangle', vol: .08 }); },
    score() { tone({ f0: 880, f1: 880, dur: .08, type: 'square', vol: .05 }); tone({ f0: 1320, f1: 1320, dur: .12, type: 'square', vol: .05, delay: .08 }); },
    fish()  { [660, 880, 1100].forEach((f, i) => tone({ f0: f, f1: f * 1.02, dur: .09, type: 'triangle', vol: .08, delay: i * .06 })); },
    meow()  { // sad "meow": rising then falling sawtooth through a sweep
      tone({ f0: 500, f1: 900, dur: .18, type: 'sawtooth', vol: .07 });
      tone({ f0: 900, f1: 300, dur: .45, type: 'sawtooth', vol: .07, delay: .17 });
    }
  };
  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    muted = !muted; store.set('flappycat.muted', muted);
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });
  muteBtn.addEventListener('pointerdown', e => e.stopPropagation());

  // ---------- world ----------
  const GRAVITY = 1900, FLAP_V = -560, MAX_FALL = 900;
  const PIPE_W = 82, PIPE_SPACING = 250;
  let speed, gap;

  const cat = { x: 120, y: H / 2, vy: 0, r: 22, rot: 0, flapT: 0 };
  let pipes = [], fishes = [], particles = [], popups = [];
  let state = 'ready';   // ready | playing | over
  let score = 0, t = 0, groundX = 0, shake = 0, flash = 0, overAt = 0;

  // background layers
  const stars = Array.from({ length: 70 }, () => ({
    x: Math.random() * W, y: Math.random() * (H * .55), r: Math.random() * 1.6 + .3, p: Math.random() * 6
  }));
  function makeSkyline(n, minH, maxH) {
    const arr = []; let x = 0;
    while (x < W + 200) {
      const w = 40 + Math.random() * 60;
      arr.push({ x, w, h: minH + Math.random() * (maxH - minH), win: Math.random() });
      x += w + Math.random() * 6;
    }
    return { items: arr, width: x, off: 0 };
  }
  const farCity = makeSkyline(0, 120, 240);
  const nearCity = makeSkyline(0, 70, 170);

  function reset() {
    cat.y = H / 2 - 40; cat.vy = 0; cat.rot = 0;
    pipes = []; fishes = []; particles = []; popups = [];
    score = 0; speed = 170; gap = 205;
    state = 'ready';
    startScreen.classList.remove('hidden');
    overScreen.classList.add('hidden');
  }

  function spawnPipe(x) {
    const margin = 80;
    const top = margin + Math.random() * (H - GROUND_H - gap - margin * 2);
    pipes.push({ x, top, gap, passed: false });
    if (Math.random() < .45) fishes.push({ x: x + PIPE_W / 2, y: top + gap / 2, eaten: false, wob: Math.random() * 6 });
  }

  function flap() {
    if (state === 'over') {
      if (performance.now() - overAt > 450) reset();
      return;
    }
    if (state === 'ready') {
      state = 'playing';
      startScreen.classList.add('hidden');
      spawnPipe(W + 60);
    }
    cat.vy = FLAP_V;
    cat.flapT = 1;
    sfx.flap();
    for (let i = 0; i < 5; i++) particles.push({
      x: cat.x - 18, y: cat.y + 10, vx: -60 - Math.random() * 80, vy: 40 + Math.random() * 80,
      life: .45, max: .45, kind: 'puff'
    });
  }

  function gameOver() {
    if (state === 'over') return;
    state = 'over'; overAt = performance.now();
    shake = .35; flash = 1;
    sfx.meow();
    if (score > best) { best = score; store.set('flappycat.best', best); }
    bestChip.textContent = '🏆 ' + best;
    finalScoreEl.textContent = score;
    bestScoreEl.textContent = best;
    medalEl.textContent =
      score >= 40 ? '👑 전설의 냥이' :
      score >= 25 ? '🥇 금냥 메달' :
      score >= 15 ? '🥈 은냥 메달' :
      score >= 5  ? '🥉 동냥 메달' : '🐾 조금만 더!';
    setTimeout(() => overScreen.classList.remove('hidden'), 500);
  }

  // ---------- input ----------
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });
  overScreen.addEventListener('pointerdown', e => { if (e.target === overScreen) flap(); });
  document.getElementById('retry').addEventListener('click', e => { e.stopPropagation(); overAt = 0; flap(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); if (!e.repeat) flap(); }
  });

  // ---------- update ----------
  function update(dt) {
    t += dt;
    const moving = state !== 'over';
    if (moving) {
      groundX = (groundX - speed * dt) % 40;
      farCity.off = (farCity.off - speed * .15 * dt) % farCity.width;
      nearCity.off = (nearCity.off - speed * .35 * dt) % nearCity.width;
    }

    if (state === 'ready') {
      cat.y = H / 2 + 10 + Math.sin(t * 3) * 12;
      cat.rot = Math.sin(t * 3) * .08;
      cat.flapT = (Math.sin(t * 8) + 1) / 2;
    } else {
      cat.vy = Math.min(cat.vy + GRAVITY * dt, MAX_FALL);
      cat.y += cat.vy * dt;
      const targetRot = Math.max(-.45, Math.min(1.3, cat.vy / 650));
      cat.rot += (targetRot - cat.rot) * Math.min(1, dt * 10);
      cat.flapT = Math.max(0, cat.flapT - dt * 4);

      if (cat.y - cat.r < 0) { cat.y = cat.r; cat.vy = 0; }
      if (cat.y + cat.r > H - GROUND_H) {
        cat.y = H - GROUND_H - cat.r;
        cat.vy = 0;
        gameOver();
      }
    }

    if (state === 'playing') {
      // difficulty ramp
      speed = Math.min(260, 170 + score * 3);
      gap = Math.max(160, 205 - score * 1.5);

      for (const p of pipes) {
        p.x -= speed * dt;
        if (!p.passed && p.x + PIPE_W < cat.x - cat.r) {
          p.passed = true; score++; sfx.score();
          popups.push({ x: cat.x, y: cat.y - 40, text: '+1', life: .7, color: '#fff7ea' });
        }
        // collision (circle vs rects, slightly forgiving)
        const r = cat.r - 4;
        if (hitRect(cat.x, cat.y, r, p.x, 0, PIPE_W, p.top) ||
            hitRect(cat.x, cat.y, r, p.x, p.top + p.gap, PIPE_W, H)) gameOver();
      }
      const last = pipes[pipes.length - 1];
      if (last && last.x < W - PIPE_SPACING) spawnPipe(W + 20);
      pipes = pipes.filter(p => p.x + PIPE_W > -20);

      for (const f of fishes) {
        f.x -= speed * dt;
        if (!f.eaten && Math.hypot(f.x - cat.x, f.y - cat.y) < cat.r + 16) {
          f.eaten = true; score += 2; sfx.fish();
          popups.push({ x: f.x, y: f.y - 20, text: '+2 🐟', life: .9, color: '#ffb347' });
          for (let i = 0; i < 12; i++) {
            const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 140;
            particles.push({ x: f.x, y: f.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .6, max: .6, kind: 'spark' });
          }
        }
      }
      fishes = fishes.filter(f => f.x > -30 && !f.eaten);
    }

    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.kind === 'spark') p.vy += 300 * dt;
    }
    particles = particles.filter(p => p.life > 0);
    for (const p of popups) { p.y -= 50 * dt; p.life -= dt; }
    popups = popups.filter(p => p.life > 0);

    shake = Math.max(0, shake - dt);
    flash = Math.max(0, flash - dt * 3);
  }

  function hitRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
  }

  // ---------- drawing ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1b1440');
    g.addColorStop(.55, '#4b2e7a');
    g.addColorStop(.85, '#c0608f');
    g.addColorStop(1, '#f59e7a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      ctx.globalAlpha = .4 + .6 * Math.abs(Math.sin(t * 1.5 + s.p));
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // moon
    ctx.save();
    ctx.shadowColor = 'rgba(255,240,200,.8)'; ctx.shadowBlur = 40;
    ctx.fillStyle = '#fff3d1';
    ctx.beginPath(); ctx.arc(W - 90, 120, 42, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(220,200,160,.35)';
    ctx.beginPath(); ctx.arc(W - 102, 110, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(W - 78, 134, 6, 0, Math.PI * 2); ctx.fill();
  }

  function drawCity(city, baseY, color, winColor) {
    ctx.fillStyle = color;
    for (let rep = 0; rep < 2; rep++) {
      const ox = city.off + rep * city.width;
      for (const b of city.items) {
        const x = b.x + ox; if (x > W || x + b.w < 0) continue;
        ctx.fillRect(x, baseY - b.h, b.w, b.h);
      }
    }
    if (!winColor) return;
    ctx.fillStyle = winColor;
    for (let rep = 0; rep < 2; rep++) {
      const ox = city.off + rep * city.width;
      for (const b of city.items) {
        const x = b.x + ox; if (x > W || x + b.w < 0) continue;
        for (let wy = baseY - b.h + 12; wy < baseY - 10; wy += 18)
          for (let lx = 8; lx < b.w - 10; lx += 14)
            // hash on the building's own coordinates so the lit windows stay fixed while it scrolls
            if (((lx * 7 + wy * 13 + b.win * 100) | 0) % 5 === 0) ctx.fillRect(x + lx, wy, 6, 8);
      }
    }
  }

  // Obstacles: sisal-rope cat-tree posts with a cushioned cap
  function drawPost(x, y, h, capAtBottom) {
    if (h <= 0) return;
    const g = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
    g.addColorStop(0, '#b98a52'); g.addColorStop(.45, '#e6c28b'); g.addColorStop(1, '#8f6436');
    ctx.fillStyle = g;
    ctx.fillRect(x + 8, y, PIPE_W - 16, h);
    // rope stripes
    ctx.strokeStyle = 'rgba(90,55,20,.35)'; ctx.lineWidth = 2;
    ctx.beginPath();
    const start = y - ((y % 9) + 9) % 9;
    for (let sy = start; sy < y + h; sy += 9) {
      if (sy < y) continue;
      ctx.moveTo(x + 8, sy); ctx.lineTo(x + PIPE_W - 8, sy + 4);
    }
    ctx.stroke();

    // cushion cap
    const capH = 26;
    const cy = capAtBottom ? y + h - capH : y;
    const cg = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
    cg.addColorStop(0, '#7a4fc4'); cg.addColorStop(.5, '#a77cf0'); cg.addColorStop(1, '#5c3a9a');
    ctx.fillStyle = cg;
    roundRect(x, cy, PIPE_W, capH, 10); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    roundRect(x + 6, cy + 4, PIPE_W - 12, 6, 3); ctx.fill();
    // little paw print on the cap
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    const px = x + PIPE_W / 2, py = cy + capH / 2 + 3;
    ctx.beginPath(); ctx.ellipse(px, py, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
    for (const [dx, dy] of [[-6, -5], [-2, -8], [2, -8], [6, -5]]) {
      ctx.beginPath(); ctx.arc(px + dx, py + dy, 1.8, 0, Math.PI * 2); ctx.fill();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawFish(f) {
    const y = f.y + Math.sin(t * 4 + f.wob) * 6;
    ctx.save();
    ctx.translate(f.x, y);
    ctx.shadowColor = 'rgba(120,220,255,.9)'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#7fd8ff';
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(24, -9); ctx.lineTo(24, 9); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#1b1440';
    ctx.beginPath(); ctx.arc(-7, -2, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(27,20,64,.4)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(1, 0, 6, -1, 1); ctx.stroke();
    ctx.restore();
  }

  function drawCat() {
    const dead = state === 'over';
    ctx.save();
    ctx.translate(cat.x, cat.y);
    ctx.rotate(cat.rot);

    const orange = '#ff9f43', dark = '#e2702a', cream = '#ffe2c2';

    // tail (wavy)
    ctx.strokeStyle = orange; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-20, 4);
    const w = Math.sin(t * 9) * 8;
    ctx.bezierCurveTo(-36, 0 + w, -40, -18 - w, -30, -28);
    ctx.stroke();
    ctx.strokeStyle = dark; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(-31, -24); ctx.lineTo(-30, -28); ctx.stroke();

    // back paws / legs flap
    const leg = cat.flapT * 10;
    ctx.fillStyle = orange;
    ctx.beginPath(); ctx.ellipse(-10, 16 + leg * .3, 6, 8, .4 + leg * .05, 0, Math.PI * 2); ctx.fill();

    // body
    ctx.fillStyle = orange;
    ctx.beginPath(); ctx.ellipse(-2, 4, 24, 17, 0, 0, Math.PI * 2); ctx.fill();
    // stripes
    ctx.strokeStyle = dark; ctx.lineWidth = 3.5;
    for (const sx of [-14, -6, 2]) {
      ctx.beginPath(); ctx.moveTo(sx, -12); ctx.quadraticCurveTo(sx + 3, -6, sx, 0); ctx.stroke();
    }
    // belly
    ctx.fillStyle = cream;
    ctx.beginPath(); ctx.ellipse(2, 12, 13, 7, 0, 0, Math.PI * 2); ctx.fill();

    // front paws — stretch forward "superman" style when flapping
    ctx.fillStyle = cream;
    ctx.beginPath(); ctx.ellipse(16 + leg, 16 - leg * .8, 7, 5, -.3 - leg * .03, 0, Math.PI * 2); ctx.fill();

    // head
    ctx.save();
    ctx.translate(18, -8);
    // ears
    ctx.fillStyle = orange;
    ctx.beginPath(); ctx.moveTo(-14, -8); ctx.lineTo(-12, -28); ctx.lineTo(-1, -14); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(4, -14); ctx.lineTo(14, -27); ctx.lineTo(16, -6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff8fb1';
    ctx.beginPath(); ctx.moveTo(-11, -11); ctx.lineTo(-10.5, -22); ctx.lineTo(-4, -14); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(6, -14); ctx.lineTo(12.5, -22); ctx.lineTo(13, -9); ctx.closePath(); ctx.fill();

    ctx.fillStyle = orange;
    ctx.beginPath(); ctx.ellipse(0, 0, 18, 16, 0, 0, Math.PI * 2); ctx.fill();
    // forehead stripes
    ctx.strokeStyle = dark; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-3, -15); ctx.lineTo(-2, -9);
    ctx.moveTo(2, -15); ctx.lineTo(2, -9);
    ctx.stroke();
    // muzzle
    ctx.fillStyle = cream;
    ctx.beginPath(); ctx.ellipse(5, 6, 9, 7, 0, 0, Math.PI * 2); ctx.fill();

    // eyes
    if (dead) {
      ctx.strokeStyle = '#2a1a0a'; ctx.lineWidth = 2.5;
      for (const ex of [-5, 9]) {
        ctx.beginPath();
        ctx.moveTo(ex - 3.5, -6); ctx.lineTo(ex + 3.5, 1);
        ctx.moveTo(ex + 3.5, -6); ctx.lineTo(ex - 3.5, 1);
        ctx.stroke();
      }
    } else {
      const blink = (t % 3.2) < .12;
      for (const ex of [-5, 9]) {
        if (blink) {
          ctx.strokeStyle = '#2a1a0a'; ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.moveTo(ex - 4, -3); ctx.quadraticCurveTo(ex, 0, ex + 4, -3); ctx.stroke();
        } else {
          ctx.fillStyle = '#b8f26a';
          ctx.beginPath(); ctx.ellipse(ex, -3, 4.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#1a1a1a';
          ctx.beginPath(); ctx.ellipse(ex + .8, -3, 1.8, 4.6, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(ex + 2, -5.5, 1.3, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
    // nose + mouth
    ctx.fillStyle = '#ff6b9a';
    ctx.beginPath(); ctx.moveTo(3, 3); ctx.lineTo(8, 3); ctx.lineTo(5.5, 6); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#6b3a1a'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (dead) { ctx.arc(5.5, 11, 3, Math.PI * 1.1, Math.PI * 1.9); }
    else { ctx.moveTo(5.5, 6); ctx.quadraticCurveTo(3, 10, 1, 8); ctx.moveTo(5.5, 6); ctx.quadraticCurveTo(8, 10, 10, 8); }
    ctx.stroke();
    // whiskers
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(12, 6); ctx.lineTo(26, 2);
    ctx.moveTo(12, 8); ctx.lineTo(26, 9);
    ctx.moveTo(-1, 6); ctx.lineTo(-14, 3);
    ctx.moveTo(-1, 8); ctx.lineTo(-14, 10);
    ctx.stroke();
    // blush
    ctx.fillStyle = 'rgba(255,120,150,.35)';
    ctx.beginPath(); ctx.ellipse(-8, 5, 3.5, 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(15, 5, 3.5, 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.restore();
  }

  function drawGround() {
    const y = H - GROUND_H;
    // rooftop
    ctx.fillStyle = '#3a2b5e';
    ctx.fillRect(0, y, W, GROUND_H);
    ctx.fillStyle = '#5b4590';
    ctx.fillRect(0, y, W, 14);
    ctx.fillStyle = '#4a3777';
    for (let x = groundX; x < W; x += 40) ctx.fillRect(x, y + 3, 20, 8);
    // tiles
    ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let row = 0; row < 3; row++) {
      const ry = y + 26 + row * 22;
      const off = (groundX + (row % 2) * 20) % 40;
      for (let x = off - 40; x < W + 40; x += 40) { ctx.moveTo(x, ry); ctx.arc(x + 20, ry, 20, Math.PI, 0, true); }
    }
    ctx.stroke();
  }

  function drawScore() {
    if (state === 'ready') return;
    ctx.save();
    ctx.font = '64px Jua, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 8; ctx.strokeStyle = '#2a1850';
    ctx.strokeText(score, W / 2, 110);
    ctx.fillStyle = '#fff7ea';
    ctx.fillText(score, W / 2, 110);
    ctx.restore();
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * 14 * shake / .35, (Math.random() - .5) * 14 * shake / .35);

    drawSky();
    drawCity(farCity, H - GROUND_H, '#3b2a6b', 'rgba(255,220,140,.35)');
    drawCity(nearCity, H - GROUND_H, '#2a1f4f', 'rgba(255,210,120,.6)');

    for (const p of pipes) {
      drawPost(p.x, -10, p.top + 10, true);
      drawPost(p.x, p.top + p.gap, H - GROUND_H - (p.top + p.gap), false);
    }
    for (const f of fishes) drawFish(f);

    for (const p of particles) {
      const a = p.life / p.max;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.kind === 'spark' ? '#ffd27a' : '#ffffff';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.kind === 'spark' ? 3 : 5 * (1.5 - a), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawGround();
    drawCat();

    ctx.font = '26px Jua, sans-serif'; ctx.textAlign = 'center';
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.lineWidth = 5; ctx.strokeStyle = '#2a1850'; ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;

    drawScore();
    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash * .7})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.033, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
